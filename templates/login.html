
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — АвтоПрофи-Сервис</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080808;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            border: 1px solid #383838;
            border-radius: 16px;
            font-size: 30px;
        }

        h1 {
            font-size: 25px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-label {
            color: #ccc;
            font-size: 14px;
        }

        .form-control {
            min-height: 48px;
            background: #191919;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
        }

        .form-control:focus {
            background: #191919;
            color: #fff;
            border-color: #888;
            box-shadow: 0 0 0 3px rgba(255,255,255,.08);
        }

        .form-control::placeholder {
            color: #666;
        }

        .btn-login {
            width: 100%;
            min-height: 48px;
            margin-top: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
        }

        .btn-login:hover {
            background: #ddd;
            color: #000;
        }

        .btn-login:disabled {
            opacity: .6;
        }

        #errorMessage {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background: #351616;
            border: 1px solid #703030;
            border-radius: 8px;
            color: #ffb0b0;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 25px;
            color: #666;
            text-align: center;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            <i class="bi bi-car-front-fill"></i>
        </div>

        <h1>АвтоПрофи-Сервис</h1>
        <p class="subtitle">Вход в систему управления автосервисом</p>

        <form id="loginForm">

            <div class="mb-3">
                <label for="email" class="form-label">Электронная почта</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Введите email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Пароль</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-login" id="loginButton">
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Войти в систему
            </button>

            <div id="errorMessage"></div>

        </form>

        <div class="footer">
            © 2026 АвтоПрофи-Сервис
        </div>

    </div>

    <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
